yaml
name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    name: Analyze C++
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp

      - name: Sync vcpkg baseline to installed version
        shell: pwsh
        run: |
          cd $env:VCPKG_INSTALLATION_ROOT
          git fetch origin
          git checkout origin/master
          cd $env:GITHUB_WORKSPACE
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" x-update-baseline --add-initial-baseline

      - name: Configure and build
        run: |
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake --build build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3